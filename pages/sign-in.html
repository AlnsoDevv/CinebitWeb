<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBit</title>
    <link rel="stylesheet" href="../css/styles_login_register.css">
</head>
<body>
    <header>
            <nav>
               <a href="index.html"><h1>CineBit</h1></a>
                <a id="acerca-de" href="">Acerca de</a>

            </nav>

        </header>
    <main> 
            
<div class="contenedor-formulario">
    <form>
        <h2>¡Bienvenido!</h2>
        <h4>¡Que gusto tenerte devuelta!</h4>

        <div class="email">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-mail"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10" /><path d="M3 7l9 6l9 -6" /></svg>         
            <label class="sr-only" for="correo">Email:</label>
            <input type="email" id="correo" placeholder="Correo Electrónico">
           
        </div>

        <div class="password">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-lock-password"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2l0 -6" /><path d="M8 11v-4a4 4 0 1 1 8 0v4" /><path d="M15 16h.01" /><path d="M12.01 16h.01" /><path d="M9.02 16h.01" /></svg>
            <label  class="sr-only" for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" placeholder="Contraseña">
            
        </div>

        <button id="iniciar-sesion" type="submit">Iniciar Sesión</button>
        
        <div class="registro">
        <p>¿No tienes cuenta? <a id="register" href="register.html">Registrate</a></p>
        </div>
        

    </form>
</div>

    </main>
</body>
</html>
