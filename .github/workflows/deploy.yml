name: Despliegue en AWS EC2

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conectar por SSH y actualizar
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # IMPORTANTE: Cambia "mi-proyecto" por el nombre real de tu carpeta en EC2
            cd /home/ubuntu/mi-proyecto
            git pull origin main
